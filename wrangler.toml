name = "navihive"
main = "worker/index.ts"
compatibility_date = "2025-04-05"

[assets]
not_found_handling = "single-page-application"

[observability]
enabled = true

# D1数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "navigation-db"
database_id = "0a15e741-7f9f-4b92-80fd-8cea099c49f6"

# 非敏感变量
# 敏感信息 (AUTH_USERNAME, AUTH_PASSWORD, AUTH_SECRET) 请通过 `wrangler secret put` 设置：
#   wrangler secret put AUTH_USERNAME
#   wrangler secret put AUTH_PASSWORD
#   wrangler secret put AUTH_SECRET
# 注意：AUTH_PASSWORD 必须填入 bcrypt 哈希，用 `pnpm hash-password <密码>` 生成
[vars]
AUTH_ENABLED = "true"

# 只读路由是否也要求登录（游客模式开关）：
#   "false"（默认）→ 开放游客模式：未登录可浏览 is_public=1 内容，登录页显示「游客访问」入口
#   "true"         → 完全私密：所有内容（含只读）都需要登录，登录页不显示游客入口
# 此变量为非敏感配置，放 [vars]；也可在 Cloudflare 控制台
# Workers & Pages → 你的 Worker → Settings → Variables and Secrets → Text 中添加
AUTH_REQUIRED_FOR_READ = "false"
